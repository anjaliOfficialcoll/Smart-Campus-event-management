<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${errorCode} + ' Error | CampusEvents'">Error</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <div th:replace="~{fragments/layout :: navbar}"></div>

  <div class="container section">
    <div class="error-page">
      <div class="error-code" th:text="${errorCode ?: '500'}">500</div>
      <h1 class="error-title" th:text="${errorTitle ?: 'Something Went Wrong'}">Error</h1>
      <p class="error-message" th:text="${errorMessage ?: 'An unexpected error occurred.'}">Message</p>
      <div class="error-actions">
        <a th:href="@{/}" class="btn btn-primary">← Go Home</a>
        <a href="javascript:history.back()" class="btn btn-ghost">Go Back</a>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
